Use just-scrape first when SGAI_API_KEY is available. Use Browser Use for live visual inspection when local Chrome remote debugging is available. Use Playwright for deterministic screenshots, DOM extraction, and responsive checks. Use Scrapfly only when normal scraping/browser inspection is blocked or incomplete and SCRAPFLY_API_KEY is available. Record missing API keys or local browser permission gates in docs/research/reference-site-inventory.md. Never reuse reference copy, photos, testimonials, logos, contact details, disclaimers, or brand identity.
"""

